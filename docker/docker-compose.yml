services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volleyer_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - volleyer-network
    command: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volleyer_user"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    networks:
      - volleyer-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - volleyer-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  auth-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-auth-service:${AUTH_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy

  events-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-events-service:${EVENTS_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy

  clubs-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-clubs-service:${CLUBS_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  profiles-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-profiles-service:${PROFILES_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy

  messages-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-messages-service:${MESSAGES_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy

  notifications-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-notifications-service:${NOTIFICATIONS_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  social-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-social-service:${SOCIAL_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  coaching-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-coaching-service:${COACHING_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payments-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-payments-service:${PAYMENTS_SERVICE_TAG:-main}
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Internal admin plane. Never published and never behind Caddy: the only thing that can
  # reach it is cloudflared, and the only thing that reaches cloudflared is Cloudflare
  # Access. Putting an admin vhost on the public :443 surface would defeat the point
  # (SPI-6058). The "admin" profile keeps it out of every environment that has not opted in.
  admin-console:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/admin-console:${ADMIN_CONSOLE_TAG:-main}
    profiles: ["admin"]
    networks:
      - volleyer-network
    depends_on:
      postgres:
        condition: service_healthy
    # 403 is the pass. There is deliberately no unauthenticated health path, so a refusal
    # is the only honest liveness signal: it proves the server is up AND the gate is shut.
    # A 200 here would mean the gate had failed open, which must not read as healthy.
    # Exec form with node: the image is distroless and has no shell, curl or wget.
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status === 403 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles: ["admin"]
    command: tunnel --no-autoupdate run
    networks:
      - volleyer-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-bielov-team-track}/volleyer-frontend:${FRONTEND_TAG:-main}
    profiles: ["development"]
    networks:
      - volleyer-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
networks:
  volleyer-network:
    driver: bridge
