services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - volleyer-network
    # No depends_on — Caddy returns 502 for unavailable upstreams until they start.
    # This also avoids pulling all service images on first deploy.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  postgres:
    restart: unless-stopped
    env_file: .env.common
    ports:
      - "127.0.0.1:5432:5432"
      - "${WG_BIND_IP:-10.10.0.2}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volleyer_user"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    env_file: .env.common
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15692:15692"
    env_file: .env.common
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15005:15005"
    env_file: [.env.common, .env.auth]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  events-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15010:15010"
    env_file: [.env.common, .env.events]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clubs-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15020:15020"
    env_file: [.env.common, .env.clubs]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  profiles-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15170:15170"
    env_file: [.env.common, .env.profiles]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  messages-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15180:15180"
    env_file: [.env.common, .env.messages]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notifications-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15030:15030"
    env_file: [.env.common, .env.notifications]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  social-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15040:15040"
    env_file: [.env.common, .env.social]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  coaching-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15060:15060"
    env_file: [.env.common, .env.coaching]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  payments-service:
    restart: unless-stopped
    ports:
      - "${WG_BIND_IP:-10.10.0.2}:15050:15050"
    env_file: [.env.common, .env.payments]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    container_name: otel-collector
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    networks:
      - volleyer-network
    environment:
      - GOMEMLIMIT=200MiB
      - DEPLOYMENT_ENVIRONMENT=production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    profiles: []
    restart: unless-stopped
    env_file: [.env.common, .env.frontend]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # No `ports` on purpose: the console is reachable only through cloudflared, which
  # reaches it over the compose network. Publishing anything here would put the admin
  # plane on the box's public surface, which is the one thing the design forbids.
  admin-console:
    restart: unless-stopped
    env_file: [.env.admin-console]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TUNNEL_TOKEN comes from .env.cloudflared, which is created on the box and tracked
  # nowhere. The token is the tunnel's credential: anything holding it can serve this
  # hostname (admin.volleyspike.app).
  cloudflared:
    restart: unless-stopped
    env_file: [.env.cloudflared]
    depends_on:
      - admin-console
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
