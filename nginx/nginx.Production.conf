events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # Upstream servers
    upstream auth-service {
        server volleyer-auth:5150;
        keepalive 32;
    }

    upstream events-service {
        server volleyer-events:5160;
        keepalive 32;
    }

    upstream profile-service {
        server volleyer-profile:5170;
        keepalive 32;
    }

    upstream message-service {
        server volleyer-message:5180;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.volleyspike.app _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Admin console endpoints, on every service that has them.
        #
        # The console reaches the services directly over the Docker network, never through this
        # gateway, so nothing legitimate arrives here. The services check the console's shared
        # secret themselves and that is the real control; this is a second layer. A regex
        # location is matched ahead of every prefix location, so this wins over /auth/ and
        # /clubs/ wherever it sits; it is first so that it also wins among regexes, which are
        # tried in file order.
        # Case-insensitive: ASP.NET routes are, so /auth/v1/Admin/ reaches the same endpoint
        # and a case-sensitive rule would be walked straight around.
        location ~* ^/(auth|clubs)/v[0-9]+/admin/ {
            deny all;
            access_log /var/log/nginx/admin-probe.log;
        }

        # Auth service routes
        location /auth/ {
            limit_req zone=auth burst=20 nodelay;
            
            proxy_pass http://auth-service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Auth health check
        location /auth/health {
            proxy_pass http://auth-service/health;
            access_log off;
        }

        # Events service routes
        location /events/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://events-service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Events health check
        location /events/health {
            proxy_pass http://events-service/health;
            access_log off;
        }

        # SignalR hub for events service (position, payments)
        location /events/hubs/ {
            proxy_pass http://events-service/hubs/;
            proxy_http_version 1.1;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Disable buffering for SignalR
            proxy_buffering off;
            proxy_cache off;

            # Extended timeouts for long-lived connections
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60s;
        }

        # Profile service routes
        location /profile/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://profile-service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Profile health check
        location /profile/health {
            proxy_pass http://profile-service/health;
            access_log off;
        }

        # SignalR hub for messages service (messaging hub)
        location /messages/hubs/ {
            proxy_pass http://message-service/hubs/;
            proxy_http_version 1.1;

            # WebSocket headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Disable buffering for SignalR
            proxy_buffering off;
            proxy_cache off;

            # Extended timeouts for long-lived connections
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60s;
        }

        # Messages service routes
        location /messages/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://message-service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Messages health check
        location /messages/health {
            proxy_pass http://message-service/health;
            access_log off;
        }

        # Default route - can serve static files or redirect
        location / {
            return 404;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}